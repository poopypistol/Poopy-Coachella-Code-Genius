name: Coachella Airbnb tracker

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub sometimes runs a few minutes late)
  workflow_dispatch:          # adds a "Run workflow" button for testing

permissions:
  contents: write             # lets the job save state.json back to the repo

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Airbnb
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python tracker.py

      - name: Save state
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
